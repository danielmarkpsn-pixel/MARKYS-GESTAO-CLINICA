spring:
  application:
    name: markys-gestao-clinica
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/markys}
    username: ${DATABASE_USERNAME:markys}
    password: ${DATABASE_PASSWORD:markys_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework.security: INFO
